- insert:
    - id: auto-approve
      name: dsh-auto-approve
      config:
        presetName: sandboxed-auto
        provider: null
        model: null
        timeoutMs: 15000
        extraDangerPatterns: []
        dangerPatterns: null
        sessionMemory: true
        sessionMemoryTtlMs: 1800000
        shadowMode: false

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      sandboxed-auto:
        sandbox: workspace-write
        approval: ask
        name: Sandboxed Auto
        description: 保留工作区沙箱；例行升级由分类器一次性批准，危险或不确定时询问。Keeps the workspace sandbox; routine escalations are approved once by a classifier, dangerous or uncertain ones ask.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
