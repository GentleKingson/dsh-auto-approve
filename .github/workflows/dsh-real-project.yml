name: DSH Real Project

# End-to-end check on a pinned third-party project (lukeed/clsx): baseline
# PASS, seeded bug FAIL, one `dsh --profile headless` run repairs it, with one
# plugin allowed-once and one fail-closed handoff in the same run. Agent and
# classifier turns are scripted; no secret is used. Separate from the
# required PR checks. See docs/REAL_PROJECT_CI.md.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: mock (scripted model, no secrets). A live suite is not available; see docs/REAL_PROJECT_CI.md.
        type: choice
        options: [mock]
        default: mock
  pull_request:
    paths:
      - .github/workflows/dsh-real-project.yml
      - scripts/ci-dsh-real-project.mjs
      - scripts/ci-dsh-integration.mjs
      - test/fixtures/real-projects/**
      - index.js
      - danger-patterns.js
      - cordis.patch.yml
      - package.json

permissions:
  contents: read

jobs:
  real-project-mock:
    name: real project clsx (DSH 0.2.0-rc.2, scripted model)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # clsx's `uvu -r esm` test runner fails on Node 22+, so the project's
      # own install and tests run on Node 20; DSH runs on Node 24 below.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Record project Node
        run: echo "PROJECT_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install pinned DSH and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
      - name: Real project through headless DSH
        run: >-
          node scripts/ci-dsh-real-project.mjs
          --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --root "$RUNNER_TEMP/dsh-real-project"
          --evidence "$RUNNER_TEMP/dsh-real-project-evidence"
          --project-node "$PROJECT_NODE_BIN"
      # Scripted model and a random fake canary only; no credential is in this job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-real-project-mock
          path: ${{ runner.temp }}/dsh-real-project-evidence
          if-no-files-found: error
          retention-days: 30
