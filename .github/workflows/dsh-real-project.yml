name: DSH Real Project

# End-to-end check on pinned real projects: lukeed/clsx (baseline PASS,
# seeded bug FAIL) and the G-003 legacy case (public tests exactly 3 PASS /
# 3 FAIL). One `dsh --profile headless` run per fixture repairs the public
# tests, with one plugin allowed-once and one fail-closed handoff in the same
# run. Agent and classifier turns are scripted; no secret is used, and the
# G-003 held-out judge is not in this repository (hiddenJudgeScore NOT_RUN).
# Separate from the required PR checks. See docs/REAL_PROJECT_CI.md.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: mock (scripted model, no secrets). Real models run in dsh-real-project-live.yml.
        type: choice
        options: [mock]
        default: mock
  pull_request:
    paths:
      - .github/workflows/dsh-real-project.yml
      - scripts/ci-dsh-real-project.mjs
      - scripts/ci-dsh-real-project-live.mjs
      - scripts/ci-dsh-live.mjs
      - scripts/ci-dsh-integration.mjs
      - scripts/ci-dsh-real-project-judge.mjs
      - scripts/real-project-fixtures.mjs
      - test/fixtures/real-projects/**
      - index.js
      - danger-patterns.js
      - cordis.patch.yml
      - package.json

permissions:
  contents: read

jobs:
  real-project-mock:
    name: real project ${{ matrix.fixture }} (DSH 0.2.0-rc.2, scripted model)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [clsx, g003]
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # clsx's `uvu -r esm` test runner fails on Node 22+, so the projects'
      # own install and tests run on Node 20 (G-003 needs >=20); DSH runs on
      # Node 24 below.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Record project Node
        run: echo "PROJECT_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install pinned DSH and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
      - name: Real project through headless DSH
        run: >-
          node scripts/ci-dsh-real-project.mjs --fixture "${{ matrix.fixture }}"
          --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --root "$RUNNER_TEMP/dsh-real-project"
          --evidence "$RUNNER_TEMP/dsh-real-project-evidence"
          --project-node "$PROJECT_NODE_BIN"
      # Scripted model and a random fake canary only; no credential is in this job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-real-project-mock-${{ matrix.fixture }}
          path: ${{ runner.temp }}/dsh-real-project-evidence
          if-no-files-found: error
          retention-days: 30

  # The live driver (scripts/ci-dsh-real-project-live.mjs) with the local
  # scripted endpoint standing in for the model gateway: wiring, guards and
  # accounting for suites A/B/C/D, no secret and no real model.
  real-project-live-self-test:
    name: live driver self-test (${{ matrix.fixture }} ${{ matrix.task }} suite ${{ matrix.suite }}, no model)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: [clsx, g003]
        suite: [A, B, C]
        task: [case]
        # G-003-E01: the same repair plus a QA report delivered outside the workspace.
        include:
          - { fixture: g003, suite: A, task: e01 }
          - { fixture: g003, suite: B, task: e01 }
          - { fixture: g003, suite: C, task: e01 }
          - { fixture: g003, suite: D, task: d01 }
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Record project Node
        run: echo "PROJECT_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install pinned DSH and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
      - name: Live driver self-test
        run: >-
          node scripts/ci-dsh-real-project-live.mjs --self-test --suite "${{ matrix.suite }}" --fixture "${{ matrix.fixture }}" --task "${{ matrix.task }}"
          --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --root "$RUNNER_TEMP/dsh-real-project-live"
          --evidence "$RUNNER_TEMP/dsh-real-project-live-summary"
          --project-node "$PROJECT_NODE_BIN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-real-project-live-self-test-${{ matrix.fixture }}-${{ matrix.task }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/dsh-real-project-live-summary
          if-no-files-found: error
          retention-days: 30
