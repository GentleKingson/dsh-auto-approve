name: DSH Real Project Live

# Real model on a pinned fixture (clsx or the G-003 legacy case) through a
# restricted model gateway.
# The provider key lives only in the gateway; this job gets the gateway URL
# and a short-lived, quota-capped run token, which the agent's shell can
# read. Manual dispatch on main only, in its own environment (not dsh-live,
# which holds a provider key). See docs/REAL_PROJECT_CI.md for the gateway
# requirements and suites A/B/C. G-003's held-out judge never comes near
# this job: grade the uploaded agent.diff offline.

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: clsx (seeded one-line bug) or g003 (G-003 attachment-boundary legacy case)
        type: choice
        options: [clsx, g003]
        default: clsx
      task:
        description: g003 only. case (the case's own AI_TASK.md) or e01 (G-003-E01, which also asks for a QA report in ../qa-artifacts, outside the workspace)
        type: choice
        options: [case, e01]
        default: case
      suite:
        description: A real agent + scripted classifier (shadow), B scripted agent + real classifier (actual allowed-once), C both real (shadow)
        type: choice
        options: [A, B, C]
        default: A
      allow_direct_provider:
        description: Use the real OpenCode Go key in DSH_CI_RUN_TOKEN directly (no gateway). The agent's shell can read it; rotate the key afterwards.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dsh-real-project-live
  cancel-in-progress: false

jobs:
  real-project-live:
    name: real project ${{ inputs.fixture }} ${{ inputs.task }} live (suite ${{ inputs.suite }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Put DSH_CI_GATEWAY_URL and DSH_CI_RUN_TOKEN on this environment (and
    # optionally the variable DSH_CI_GATEWAY_MODEL); restrict it to main and
    # require a reviewer. Never put a provider API key here.
    environment: dsh-real-project-live
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Record project Node
        run: echo "PROJECT_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install pinned DSH and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
      # A real agent's shell can read this checkout. Drop the G-003 scripted
      # answer key and the git history that holds it; the driver re-checks
      # and blocks if either is still here.
      - name: Remove the scripted answer key (real-agent suites)
        if: inputs.fixture == 'g003' && inputs.suite != 'B'
        run: rm -rf .git test/fixtures/real-projects/g003.scripted-repair.json
      - name: Real project through the model gateway
        env:
          DSH_CI_GATEWAY_URL: ${{ secrets.DSH_CI_GATEWAY_URL }}
          DSH_CI_RUN_TOKEN: ${{ secrets.DSH_CI_RUN_TOKEN }}
          DSH_CI_GATEWAY_MODEL: ${{ vars.DSH_CI_GATEWAY_MODEL }}
        run: >-
          node scripts/ci-dsh-real-project-live.mjs --suite "${{ inputs.suite }}" --fixture "${{ inputs.fixture }}" --task "${{ inputs.task }}"
          --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --root "$RUNNER_TEMP/dsh-real-project-live"
          --evidence "$RUNNER_TEMP/dsh-real-project-live-summary"
          --project-node "$PROJECT_NODE_BIN"
          ${{ inputs.allow_direct_provider && '--allow-direct-provider' || '' }}
      # Redacted summary (and, for g003, the redacted agent.diff) only;
      # transcripts, session logs and the --json stream stay under
      # $RUNNER_TEMP/dsh-real-project-live.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-real-project-live-${{ inputs.fixture }}-${{ inputs.task }}-${{ inputs.suite }}
          path: ${{ runner.temp }}/dsh-real-project-live-summary
          if-no-files-found: error
          retention-days: 7
