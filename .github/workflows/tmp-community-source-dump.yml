# TEMPORARY: removed before review. Runs the online source pin check once.
name: tmp-community-source-verify
on:
  push:
    branches: [claude/community-approval-cases-0jxqit]
    paths: [test/fixtures/dsh-community-source-review-2026-10-12.json, .github/workflows/tmp-community-source-dump.yml]
permissions:
  contents: read
  discussions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: node scripts/evaluate-community-cases.mjs --verify-sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
