name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  windows-approval:
    name: Windows approval adapters (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Native paths + parse-only PowerShell AST + disposable Python compile.
      # This is adapter coverage, not a claim of Windows DSH ACL integration.
      - run: node --test test/windows-approval.test.js test/compile-evidence.test.js test/public-approval.test.js

  # Real-host integration on the one supported DSH release over ACP. Model
  # responses come from a local scripted endpoint; see docs/ACCEPTANCE.md for
  # scope. The script asserts the host is exactly DSH_VERSION and matches the
  # plugin's exact @deepseek-ai/dsh peer.
  dsh-integration:
    name: dsh-integration (0.2.0-rc.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      # Supplies the peer @deepseek-ai/schemastery to the linked checkout.
      - run: npm ci
      - name: Install pinned DSH and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
      - name: Run DSH ACP integration
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/ci-dsh-integration.mjs
          --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --root "$RUNNER_TEMP/dsh-integration"
          --evidence "$RUNNER_TEMP/dsh-integration-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-integration-evidence-${{ env.DSH_VERSION }}
          path: ${{ runner.temp }}/dsh-integration-evidence
          if-no-files-found: error
          retention-days: 30
