name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  windows-approval:
    name: Windows approval adapters (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Native paths + parse-only PowerShell AST + disposable Python compile.
      # This is adapter coverage, not a claim of Windows DSH ACL integration.
      - run: node --test test/windows-approval.test.js test/compile-evidence.test.js test/public-approval.test.js

  # Real-host integration on the one supported DSH release over ACP. Model
  # responses come from a local scripted endpoint; see docs/ACCEPTANCE.md for
  # scope. The script asserts the host is exactly DSH_VERSION and matches the
  # plugin's exact @deepseek-ai/dsh peer.
  dsh-integration:
    name: dsh-integration (0.2.0-rc.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      # Supplies the peer @deepseek-ai/schemastery to the linked checkout.
      - run: npm ci
      - name: Install pinned DSH and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
      - name: Run DSH ACP integration
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/ci-dsh-integration.mjs
          --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --root "$RUNNER_TEMP/dsh-integration"
          --evidence "$RUNNER_TEMP/dsh-integration-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-integration-evidence-${{ env.DSH_VERSION }}
          path: ${{ runner.temp }}/dsh-integration-evidence
          if-no-files-found: error
          retention-days: 30

  # Deployment smoke for the Web client: `npm pack` of this commit installed
  # through the pinned DSH plugin manager into a fresh DSH_HOME, real `dsh web`
  # driven by pinned Playwright Chromium (presets, an automatic approval, a
  # manual rejection), then uninstall and native recovery. Model responses are
  # scripted; no secret is used. Evidence holds no login token, cookie, trace,
  # screenshot or raw session log. See docs/ACCEPTANCE.md.
  web-smoke:
    name: web smoke (0.2.0-rc.2, Chromium, packed tarball)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      # No npm ci: the installed plugin must run from the tarball alone.
      - name: Install pinned DSH, pnpm and Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run Web smoke
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/ci-dsh-web-smoke.mjs
          --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --playwright "$RUNNER_TEMP/pw/node_modules/playwright"
          --root "$RUNNER_TEMP/dsh-web-smoke"
          --evidence "$RUNNER_TEMP/dsh-web-smoke-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-web-smoke-evidence-${{ env.DSH_VERSION }}
          path: ${{ runner.temp }}/dsh-web-smoke-evidence
          if-no-files-found: error
          retention-days: 30

  windows-host:
    name: Windows DSH host (0.2.0-rc.2, mock)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: |
          npm install --prefix "$env:RUNNER_TEMP/dsh" --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          npm install --global --no-audit --no-fund pnpm@10.28.0
      - name: Run minimal native Windows host check
        run: >-
          node scripts/ci-dsh-windows.mjs
          --dsh "$env:RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --root "$env:RUNNER_TEMP/dsh-windows-host"
          --evidence "$env:RUNNER_TEMP/dsh-windows-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-windows-host
          path: ${{ runner.temp }}/dsh-windows-evidence
          retention-days: 7
          if-no-files-found: error

  # Safety regression gate for the 53 public community cases: the real
  # approval handler with a permissive low/approve mock. A verified
  # manual_required case approved as allowed-once fails this job; labels and
  # danger rules are never relaxed to clear it. Not a model-accuracy metric.
  community-offline:
    name: community offline gate (permissive mock)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Replay community cases
        run: |
          mkdir -p "$RUNNER_TEMP/community"
          set -o pipefail
          node scripts/evaluate-community-cases.mjs | tee "$RUNNER_TEMP/community/community-offline.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-offline-report
          path: ${{ runner.temp }}/community
          retention-days: 30
          if-no-files-found: error

  # Non-executing boundary for the community Live Shadow suite, proven on the
  # pinned host without any secret: the real bash executor is replaced by an
  # inert one, five controls must reach it, then the 30 community cases run
  # with a permissive scripted classifier and every escalation rejected.
  # Zero execution attempts is a hard check. See docs/COMMUNITY_CASES.md.
  community-host-boundary:
    name: community host boundary (0.2.0-rc.2, mock classifier)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install pinned DSH and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
      # Two rounds plus the paired controls prove --repeat and --controls wiring; verdicts are scripted.
      - name: Community cases through the inert executor
        run: >-
          node scripts/ci-dsh-live-community.mjs --classifier mock --controls --repeat 2
          --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          --root "$RUNNER_TEMP/dsh-community"
          --evidence "$RUNNER_TEMP/dsh-community-summary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-host-boundary-summary
          path: ${{ runner.temp }}/dsh-community-summary
          retention-days: 30
          if-no-files-found: error
