name: DSH Live Approval

# Real-model shadow check: the plugin's classifier calls OpenCode Go
# (opencode-go / deepseek-v4.1-flash) behind the pinned DSH ACP host, while
# shadowMode stays on and every escalation is rejected. Manual dispatch on
# main only; the API key is never available to pull requests or forks.
# See scripts/ci-dsh-live.mjs for the cases and the redacted summary.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: fixed-5 (original five cases) or community-30 (docs/COMMUNITY_CASES.md, inert executor)
        type: choice
        options: [fixed-5, community-30]
        default: fixed-5
      repeat:
        description: community-30 only. Rounds of the whole case list in fresh sessions (docs/RELIABILITY.md)
        type: choice
        options: ['1', '3', '5', '10']
        default: '1'
      controls:
        description: community-30 only. Append the paired reliability control cases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dsh-live
  cancel-in-progress: false

jobs:
  live-shadow:
    name: live-shadow (DSH 0.2.0-rc.2, opencode-go/deepseek-v4.1-flash)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # 10 rounds of 36 cases is about 360 classifier calls.
    timeout-minutes: 60
    # Put OPENCODE_GO_API_KEY on this environment and restrict it to main.
    environment: dsh-live
    env:
      DSH_VERSION: 0.2.0-rc.2
      PNPM_VERSION: 10.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Timeout, model error and malformed-reply handoffs stay offline fault
      # injection, so the live run spends no API quota on them.
      - name: Offline approval tests
        run: npm test
      - name: Install pinned DSH and pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --global --no-audit --no-fund "pnpm@$PNPM_VERSION"
      - name: Live classifier test
        if: inputs.suite != 'community-30'
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          test -n "${OPENCODE_GO_API_KEY:-}" || { echo "::error::OPENCODE_GO_API_KEY is not configured"; exit 1; }
          node scripts/ci-dsh-live.mjs \
            --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js" \
            --root "$RUNNER_TEMP/dsh-live" \
            --evidence "$RUNNER_TEMP/dsh-live-summary"
      # Community suite: the inert executor and its five controls must pass
      # before any case starts; otherwise the script stops with BLOCKED.
      - name: Live community shadow (30 cases)
        if: inputs.suite == 'community-30'
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          REPEAT: ${{ inputs.repeat || '1' }}
          CONTROLS: ${{ inputs.controls && 'yes' || '' }}
        run: |
          test -n "${OPENCODE_GO_API_KEY:-}" || { echo "::error::OPENCODE_GO_API_KEY is not configured"; exit 1; }
          node scripts/ci-dsh-live-community.mjs --classifier live \
            --repeat "$REPEAT" ${CONTROLS:+--controls} \
            --dsh "$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js" \
            --root "$RUNNER_TEMP/dsh-live" \
            --evidence "$RUNNER_TEMP/dsh-live-summary"
      # Redacted summary only; raw transcripts, session logs and stderr stay
      # under $RUNNER_TEMP/dsh-live and are discarded with the runner.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-live-summary-${{ inputs.suite || 'fixed-5' }}
          path: ${{ runner.temp }}/dsh-live-summary
          retention-days: 7
          if-no-files-found: error
